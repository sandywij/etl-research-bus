app = 'research-etl-polling'
primary_region = 'sin'

[build]

[env]
  API_LOCATION_PARAM = 'BusStopCode'
  API_TOKEN_HEADER = 'AccountKey'
  DB_RETENTION_DAYS = '3'
  END_HOUR = '24'
  LOCATIONS_FILE = 'locations.csv'
  POLL_INTERVAL = '300'
  START_HOUR = '5'
  TZ = 'Asia/Singapore'
  HEALTH_PORT = '8081'

[deploy]
  strategy = "immediate"

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '10gb'

# Main API/export server
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    hard_limit = 25
    soft_limit = 20

# Dedicated health check server — isolated from export traffic
[[services]]
  internal_port = 8081
  protocol = 'tcp'

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[[vm]]
  size = 'shared-cpu-1x'