app = "research-etl-polling"
primary_region = "sin"

[env]
  TZ = "Asia/Singapore"
  POLL_INTERVAL = "300"
  START_HOUR = "5"
  END_HOUR = "24"
  DB_RETENTION_DAYS = "3"
  LOCATIONS_FILE = "locations.csv"
  API_TOKEN_HEADER = "AccountKey"
  API_LOCATION_PARAM = "BusStopCode"

[http_service]
  internal_port = 8080
  force_https = true
  # CRITICAL: Keeps the poller running even when no one is accessing the API
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
      grace_period = "10s"
      interval = "30s"
      method = "get"
      path = "/stats"
      protocol = "http"
      timeout = "5s"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "5gb"

[[vm]]
  size = "shared-cpu-1x"