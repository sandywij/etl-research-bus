app = "research-etl-polling"
primary_region = "sin"

[build]
  image = "flyio/builder:latest"

[env]
  TZ = "Asia/Singapore"
  POLL_INTERVAL = "300"
  START_HOUR = "5"
  END_HOUR = "24"
  DB_RETENTION_DAYS = "7"
  LOCATIONS_FILE = "locations.csv"
  API_TOKEN_HEADER = "AccountKey"
  API_LOCATION_PARAM = "BusStopCode"

[[mounts]]
  source = "data"
  destination = "/data"
  size_gb = 5

